<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>음성 타이핑</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-user-select: none; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #0f0f1a;
            color: #eee;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* 상단 */
        .top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            background: #16162a;
        }
        .top-bar h1 { font-size: 16px; font-weight: 700; }
        .conn-status {
            font-size: 11px;
            padding: 4px 12px;
            border-radius: 20px;
        }
        .conn-status.on { background: #0a3d2a; color: #4ade80; }
        .conn-status.off { background: #3d0a0a; color: #f87171; }

        /* 미리보기 */
        .preview {
            flex: 1;
            margin: 12px;
            padding: 16px;
            background: #16162a;
            border-radius: 16px;
            border: 2px solid #222244;
            font-size: 20px;
            line-height: 1.6;
            overflow-y: auto;
            color: #ddd;
            min-height: 0;
        }
        .preview .listening-text {
            color: #f59e0b;
            opacity: 0.7;
        }
        .preview .empty {
            color: #444;
            font-size: 16px;
        }

        /* 마이크 버튼 영역 */
        .mic-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 0 12px;
        }

        .mic-btn {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: none;
            background: #e94560;
            color: white;
            font-size: 48px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 24px rgba(233, 69, 96, 0.3);
        }
        .mic-btn:active { transform: scale(0.95); }
        .mic-btn.recording {
            background: #22c55e;
            box-shadow: 0 0 0 8px rgba(34, 197, 94, 0.2), 0 0 0 16px rgba(34, 197, 94, 0.1);
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 0 8px rgba(34,197,94,0.2), 0 0 0 16px rgba(34,197,94,0.1); }
            50% { box-shadow: 0 0 0 12px rgba(34,197,94,0.3), 0 0 0 24px rgba(34,197,94,0.1); }
        }

        .mic-label {
            margin-top: 12px;
            font-size: 14px;
            color: #888;
            font-weight: 600;
        }

        /* 하단 보조 버튼 */
        .bottom-bar {
            display: flex;
            gap: 8px;
            padding: 8px 12px 20px;
        }
        .bottom-bar button {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.1s;
        }
        .bottom-bar button:active { transform: scale(0.95); }
        .btn-enter { background: #0f3460; color: #eee; }
        .btn-backspace { background: #333; color: #ccc; }
        .btn-clear { background: #2a1a1a; color: #f87171; }

        /* 설정 */
        .settings {
            display: flex;
            gap: 8px;
            padding: 0 12px 8px;
            align-items: center;
            justify-content: center;
        }
        .settings label {
            font-size: 12px;
            color: #666;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .settings input[type="checkbox"] {
            accent-color: #e94560;
        }
    </style>
</head>
<body>
    <div class="top-bar">
        <h1>음성 타이핑</h1>
        <span class="conn-status off" id="connStatus">연결 중...</span>
    </div>

    <div class="preview" id="preview">
        <span class="empty">마이크 버튼을 누르고 말하세요</span>
    </div>

    <div class="settings">
        <label><input type="checkbox" id="autoEnter"> 말 끝나면 자동 Enter</label>
        <label><input type="checkbox" id="continuous"> 연속 인식</label>
    </div>

    <div class="mic-area">
        <button class="mic-btn" id="micBtn" onclick="toggleMic()">🎤</button>
        <div class="mic-label" id="micLabel">눌러서 시작</div>
    </div>

    <div class="bottom-bar">
        <button class="btn-backspace" onclick="doBackspace()">← 지우기</button>
        <button class="btn-enter" onclick="doEnter()">Enter ↵</button>
        <button class="btn-clear" onclick="doClear()">전체삭제</button>
    </div>

    <script>
        let ws = null;
        let recognition = null;
        let isRecording = false;
        let lastSentText = '';

        // --- WebSocket ---
        function connect() {
            const wsUrl = `ws://${location.hostname}:8766`;
            ws = new WebSocket(wsUrl);
            ws.onopen = () => {
                document.getElementById('connStatus').textContent = 'PC 연결됨';
                document.getElementById('connStatus').className = 'conn-status on';
                setInterval(() => {
                    if (ws && ws.readyState === WebSocket.OPEN)
                        ws.send(JSON.stringify({ action: 'ping' }));
                }, 30000);
            };
            ws.onclose = () => {
                document.getElementById('connStatus').textContent = '연결 끊김';
                document.getElementById('connStatus').className = 'conn-status off';
                setTimeout(connect, 3000);
            };
            ws.onerror = () => ws.close();
        }

        function send(data) {
            if (ws && ws.readyState === WebSocket.OPEN)
                ws.send(JSON.stringify(data));
        }

        // --- 음성 인식 ---
        function initSpeech() {
            const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SR) {
                document.getElementById('preview').innerHTML =
                    '<span class="empty">이 브라우저는 음성인식을 지원하지 않습니다.<br>Chrome 브라우저를 사용해주세요.</span>';
                return false;
            }

            recognition = new SR();
            recognition.lang = 'ko-KR';
            recognition.interimResults = true;
            recognition.continuous = true;

            recognition.onresult = (e) => {
                let interim = '';
                let final = '';

                for (let i = e.resultIndex; i < e.results.length; i++) {
                    const transcript = e.results[i][0].transcript;
                    if (e.results[i].isFinal) {
                        final += transcript;
                    } else {
                        interim += transcript;
                    }
                }

                // 확정된 텍스트 → PC로 전송
                if (final) {
                    send({ action: 'type', text: final });
                    lastSentText = final;
                    updatePreview(final, '');

                    if (document.getElementById('autoEnter').checked) {
                        send({ action: 'enter' });
                    }
                }

                // 인식 중 텍스트 미리보기
                if (interim) {
                    updatePreview('', interim);
                }
            };

            recognition.onend = () => {
                // 연속 인식 모드면 자동 재시작
                if (isRecording) {
                    if (document.getElementById('continuous').checked) {
                        try { recognition.start(); } catch(e) {}
                    } else {
                        stopMic();
                    }
                }
            };

            recognition.onerror = (e) => {
                if (e.error === 'no-speech') {
                    // 말 안하면 자동 재시작
                    if (isRecording) {
                        try { recognition.start(); } catch(e) {}
                    }
                } else if (e.error !== 'aborted') {
                    console.error('음성인식 오류:', e.error);
                }
            };

            return true;
        }

        function updatePreview(finalText, interimText) {
            const preview = document.getElementById('preview');
            let html = '';
            if (finalText) {
                html += finalText;
            }
            if (interimText) {
                html += `<span class="listening-text">${interimText}</span>`;
            }
            if (!html) {
                html = '<span class="empty">마이크 버튼을 누르고 말하세요</span>';
            }
            preview.innerHTML = html;
            preview.scrollTop = preview.scrollHeight;
        }

        function toggleMic() {
            if (isRecording) {
                stopMic();
            } else {
                startMic();
            }
        }

        function startMic() {
            if (!recognition && !initSpeech()) return;

            try {
                recognition.start();
                isRecording = true;
                document.getElementById('micBtn').classList.add('recording');
                document.getElementById('micLabel').textContent = '듣고 있어요...';
                updatePreview('', '');
            } catch(e) {
                console.error(e);
            }
        }

        function stopMic() {
            isRecording = false;
            if (recognition) {
                try { recognition.stop(); } catch(e) {}
            }
            document.getElementById('micBtn').classList.remove('recording');
            document.getElementById('micLabel').textContent = '눌러서 시작';
        }

        // --- 보조 버튼 ---
        function doEnter() {
            send({ action: 'enter' });
        }

        function doBackspace() {
            // 마지막 보낸 텍스트 길이만큼 지우기
            const count = lastSentText ? lastSentText.length : 1;
            send({ action: 'backspace', count: count });
            lastSentText = '';
        }

        function doClear() {
            lastSentText = '';
            document.getElementById('preview').innerHTML =
                '<span class="empty">마이크 버튼을 누르고 말하세요</span>';
        }

        // 시작
        connect();
        initSpeech();
    </script>
</body>
</html>
